services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: georgedallas_local
      POSTGRES_USER: george
      POSTGRES_PASSWORD: george-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U george -d georgedallas_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Last MinIO release published to Docker Hub (they stopped publishing
    # community images there in late 2025). The previously pinned
    # RELEASE.2026-06-02 tag never existed on any registry.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
