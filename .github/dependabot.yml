version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Payload packages must move in lockstep: a solo bump of one of them
      # (ui 3.85.1 -> 3.85.2, 2026-07-03) put two copies of @payloadcms/ui
      # in the admin bundle, and its React contexts stopped reaching our
      # custom components — every authenticated admin page crashed on
      # hydration ("Cannot destructure property 'config'").
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
    ignore:
      # lexical / @lexical/* must match the exact version
      # @payloadcms/richtext-lexical bundles (0.41.0). A solo bump of these puts
      # two Lexical copies in the admin bundle -> the #128 dual-copy crash that
      # broke every authenticated admin page. Bump them only when Payload itself
      # moves, and to the same version.
      - dependency-name: "lexical"
      - dependency-name: "@lexical/*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
