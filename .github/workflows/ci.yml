name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      PUBLIC_SITE_URL: http://localhost:4321
      CMS_PUBLIC_URL: http://localhost:3000
      MEDIA_PUBLIC_URL: http://localhost:9000/georgedallas-local-media
      DATABASE_URL: postgres://george:george-local-password@localhost:5432/georgedallas_local
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: georgedallas-local-media
      S3_ACCESS_KEY_ID: local-minio
      S3_SECRET_ACCESS_KEY: local-minio-password
      PAYLOAD_SECRET: ci-payload-secret-placeholder
      SESSION_SECRET: ci-session-secret-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
