name: Deploy Prod

# Production deployment (GDW-051). Mirrors deploy-dev.yml with the prod stacks
# and URLs. Runs in the protected `production` GitHub environment: configure
# required reviewers there to make every prod deploy pause for approval, and
# restrict the environment's deployment branches to `main`.

on:
  push:
    branches:
      - main
  # Manual redeploy/republish from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy prod stacks
        working-directory: infra
        run: npx cdk deploy prod-foundation prod-cms-cert prod-cms prod-site-cert prod-site --require-approval never --outputs-file cdk-outputs.json

      - name: Smoke test CMS health
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 70 https://cms.georgedallas.com/api/health; then
              echo "CMS health check passed."
              exit 0
            fi
            echo "Attempt ${attempt} failed (cold start ~30s; first-ever deploy also waits on DNS/CloudFront); retrying..."
            sleep 30
          done
          echo "CMS health check failed after 8 attempts."
          exit 1

      - name: Build public site
        run: pnpm --filter @georgedallas/site build
        env:
          # Build against the live prod CMS through CloudFront (which injects
          # the x-origin-verify header). Only published, public content is
          # returned (see apps/site/src/lib/content.mjs).
          CMS_API_URL: https://cms.georgedallas.com

      - name: Publish public site
        working-directory: infra
        run: |
          BUCKET=$(jq -r '."georgedallaswebsite-prod-site".SiteBucketName' cdk-outputs.json)
          DIST_ID=$(jq -r '."georgedallaswebsite-prod-site".SiteDistributionId' cdk-outputs.json)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "null" ] || [ -z "$DIST_ID" ] || [ "$DIST_ID" = "null" ]; then
            echo "Could not read site bucket/distribution from cdk outputs."
            cat cdk-outputs.json
            exit 1
          fi
          echo "Syncing build to s3://${BUCKET}"
          aws s3 sync ../apps/site/dist "s3://${BUCKET}" --delete
          echo "Invalidating CloudFront distribution ${DIST_ID}"
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"

      - name: Smoke test public site
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 30 -o /dev/null https://georgedallas.com/; then
              echo "Public site responded."
              exit 0
            fi
            echo "Attempt ${attempt} failed (DNS/CloudFront can lag on first deploy); retrying..."
            sleep 30
          done
          echo "Public site smoke test failed after 8 attempts."
          exit 1

      - name: Smoke test www redirect target
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 -o /dev/null https://www.georgedallas.com/; then
              echo "www domain responded."
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying..."
            sleep 30
          done
          echo "www smoke test failed after 6 attempts."
          exit 1
